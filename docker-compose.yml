services:

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  # Receives OTLP/HTTP (port 4318) from the Android app and forwards to Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  ← Android emulator connects here (10.0.2.2:4318)
      - "8888:8888"   # Collector self-metrics
    depends_on:
      - tempo

  # ── Grafana Tempo ───────────────────────────────────────────────────────────
  # Distributed trace storage compatible with OpenTelemetry.
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana data source)

  # ── Grafana Loki ────────────────────────────────────────────────────────────
  # Log storage backend. Receives OTLP logs from the Collector.
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki HTTP API (Grafana data source)

  # ── Grafana ─────────────────────────────────────────────────────────────────
  # Dashboard and visualization layer. Tempo data source is auto-provisioned.
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI  ← open http://localhost:3000
    depends_on:
      - tempo
      - loki

volumes:
  tempo-data:
  loki-data:
  grafana-data:
